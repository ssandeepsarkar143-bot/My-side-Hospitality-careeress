<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Offline — Hospitality Careers</title>
<style>
  body{margin:0;background:#0a0a14;color:#fff;font-family:system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .box{max-width:420px}
  h1{color:#d4af37;font-size:22px;margin:0 0 12px}
  p{color:rgba(255,255,255,.7);font-size:14px;line-height:1.6}
  button{margin-top:18px;background:linear-gradient(135deg,#d4af37,#b8941f);color:#000;border:none;padding:11px 24px;border-radius:24px;font-weight:700;cursor:pointer}
  img{width:64px;height:64px;border-radius:50%;margin-bottom:14px;opacity:.85}
</style>
</head>
<body>
<div class="box">
  <img src="/logo.png" alt="HC" onerror="this.style.display='none'"/>
  <h1>You're offline</h1>
  <p>Hospitality Careers needs an internet connection to load fresh jobs and updates. Please check your network and try again.</p>
  <button onclick="location.reload()">Retry</button>
</div>
</body>
</html>
